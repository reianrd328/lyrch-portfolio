{% extends "admin/base.html" %}

{% block title %}Upload AI Video — MY WORK CMS{% endblock %}

{% block admin_content %}
<div class="telemetry-card">
    <div class="card-header-bar">
        <div class="header-label">
            <i class="fa-solid fa-video"></i>
            <span>ADD AI VIDEO TO STUDIO</span>
        </div>
        <a href="{{ url_for('admin_videos.index') }}" class="header-link">&larr; Back to Videos</a>
    </div>

    <form method="POST" action="{{ url_for('admin_videos.create') }}" enctype="multipart/form-data" style="margin-top: 18px; display: grid; grid-template-columns: 2fr 1fr; gap: 24px;">
        <div style="display: flex; flex-direction: column; gap: 14px;">
            <div>
                <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">TITLE</label>
                <input type="text" name="title" required placeholder="AI Kung Fu Coffee Commercial" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div>
                    <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">CATEGORY</label>
                    <select name="category" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
                        <option value="AI Creative">AI Creative</option>
                        <option value="Commercial">Commercial / Ad</option>
                        <option value="Reels & TikTok">Reels &amp; TikTok</option>
                        <option value="AI Experiments">AI Experiment</option>
                    </select>
                </div>

                <div>
                    <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">DURATION</label>
                    <input type="text" name="duration" placeholder="00:10" value="00:10" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div>
                    <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">TOOLS USED</label>
                    <input type="text" name="tools_used" value="Gemini, AI Video Generation, Video Editing" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
                </div>

                <div>
                    <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">ASPECT RATIO</label>
                    <select name="aspect_ratio" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
                        <option value="9:16">9:16 (Vertical Reel / TikTok / Shorts)</option>
                        <option value="16:9">16:9 (Landscape Cinematic)</option>
                        <option value="1:1">1:1 (Square)</option>
                    </select>
                </div>
            </div>

            <div>
                <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">DESCRIPTION</label>
                <textarea name="description" rows="2" placeholder="Short description of the video..." style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;"></textarea>
            </div>

            <div>
                <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">AI GENERATION PROMPT &amp; WORKFLOW</label>
                <textarea name="prompt_text" rows="3" placeholder="Exact Gemini prompt or workflow pipeline: IDEA -> PROMPT -> GENERATION -> EDIT" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;"></textarea>
            </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 16px;">
            <div style="background: rgba(15,23,42,0.6); padding: 16px; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 12px;">
                <h4 style="font-size: 12px; color: #ffffff;">VISIBILITY</h4>
                <select name="visibility" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 8px 10px; color: #fff; font-size: 12px;">
                    <option value="published">● Published</option>
                    <option value="draft">○ Draft</option>
                    <option value="private">🔒 Private</option>
                </select>

                <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #cbd5e1; cursor: pointer;">
                    <input type="checkbox" name="featured" value="1" checked>
                    <span>⭐ Display on Homepage Studio Card</span>
                </label>
            </div>

            <div style="background: rgba(15,23,42,0.6); padding: 16px; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 10px;">
                <h4 style="font-size: 12px; color: #ffffff;">VIDEO FILE / UPLOAD</h4>
                <input type="file" name="video" accept="video/mp4,video/webm" style="font-size: 11px; color: var(--text-muted);">
                <input type="url" name="video_external_url" placeholder="Or External URL (YouTube / Cloud MP4)" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 7px 10px; color: #fff; font-size: 11px;">
            </div>

            <div style="background: rgba(15,23,42,0.6); padding: 16px; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 10px;">
                <h4 style="font-size: 12px; color: #ffffff;">VIDEO THUMBNAIL</h4>
                <input type="file" name="thumbnail" accept="image/*" style="font-size: 11px; color: var(--text-muted);">
            </div>

            <button type="submit" class="btn-command-primary">
                <i class="fa-solid fa-upload"></i> Upload &amp; Publish Video
            </button>
        </div>
    </form>
</div>
{% endblock %}
