{% extends "admin/base.html" %}

{% block title %}Skills — MY WORK CMS{% endblock %}

{% block admin_content %}
<div class="telemetry-card">
    <div class="card-header-bar">
        <div class="header-label">
            <i class="fa-solid fa-microchip"></i>
            <span>CAPABILITY &amp; SKILLS MATRIX</span>
        </div>
        <a href="{{ url_for('admin_skills.create') }}" class="btn-command-primary" style="font-size: 12px; padding: 6px 14px;">
            <i class="fa-solid fa-plus"></i> Add Skill
        </a>
    </div>

    <div style="margin-top: 18px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;">
        {% for s in skills %}
            <div style="background: rgba(15,23,42,0.7); border: 1px solid rgba(255,255,255,0.08); border-radius: var(--radius-sm); padding: 14px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h4 style="font-size: 13px; color: #fff;">{{ s.name }}</h4>
                    <span style="font-size: 10px; color: var(--neon-cyan);">{{ s.category }} &bull; {{ s.level }}%</span>
                </div>
                <form method="POST" action="{{ url_for('admin_skills.delete', id=s.id) }}" onsubmit="return confirm('Delete skill?');">
                    <button type="submit" class="btn-command-secondary" style="padding: 4px 8px; font-size: 11px; color: #f87171;">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                </form>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
