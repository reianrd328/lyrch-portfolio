{% extends "admin/base.html" %}

{% block title %}Add Skill — MY WORK CMS{% endblock %}

{% block admin_content %}
<div class="telemetry-card" style="max-width: 600px; margin: 0 auto; width: 100%;">
    <div class="card-header-bar">
        <div class="header-label">
            <i class="fa-solid fa-microchip"></i>
            <span>REGISTER SKILL</span>
        </div>
        <a href="{{ url_for('admin_skills.index') }}" class="header-link">&larr; Back to Skills</a>
    </div>

    <form method="POST" action="{{ url_for('admin_skills.create') }}" style="margin-top: 18px; display: flex; flex-direction: column; gap: 14px;">
        <div>
            <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">SKILL NAME</label>
            <input type="text" name="name" required placeholder="Python & Flask Architecture" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
        </div>

        <div>
            <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">CATEGORY</label>
            <select name="category" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
                <option value="IT Operations">IT Operations &amp; Support</option>
                <option value="Development">Software &amp; Web Development</option>
                <option value="AI & Media">AI, Prompting &amp; Video Media</option>
            </select>
        </div>

        <div>
            <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">PROFICIENCY LEVEL (1 - 100%)</label>
            <input type="number" name="level" min="1" max="100" value="90" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
        </div>

        <button type="submit" class="btn-command-primary" style="margin-top: 8px;">
            Save Skill
        </button>
    </form>
</div>
{% endblock %}
