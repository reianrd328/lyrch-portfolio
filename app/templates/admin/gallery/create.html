{% extends "admin/base.html" %}

{% block title %}Upload Image — MY WORK CMS{% endblock %}

{% block admin_content %}
<div class="telemetry-card" style="max-width: 600px; margin: 0 auto; width: 100%;">
    <div class="card-header-bar">
        <div class="header-label">
            <i class="fa-regular fa-image"></i>
            <span>ADD TO GALLERY</span>
        </div>
        <a href="{{ url_for('admin_gallery.index') }}" class="header-link">&larr; Back to Gallery</a>
    </div>

    <form method="POST" action="{{ url_for('admin_gallery.create') }}" enctype="multipart/form-data" style="margin-top: 18px; display: flex; flex-direction: column; gap: 14px;">
        <div>
            <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">IMAGE TITLE</label>
            <input type="text" name="title" required placeholder="PAWSHOP UI Design" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
        </div>

        <div>
            <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">CATEGORY</label>
            <input type="text" name="category" value="UI / UX" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
        </div>

        <div>
            <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">IMAGE FILE</label>
            <input type="file" name="image" required accept="image/*" style="font-size: 12px; color: var(--text-muted);">
        </div>

        <div>
            <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">DESCRIPTION</label>
            <textarea name="description" rows="2" placeholder="Command Center interface..." style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;"></textarea>
        </div>

        <button type="submit" class="btn-command-primary" style="margin-top: 8px;">
            Save Gallery Asset
        </button>
    </form>
</div>
{% endblock %}
