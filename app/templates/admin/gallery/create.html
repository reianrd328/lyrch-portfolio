{% extends "admin/base.html" %}

{% block title %}Upload Creative Asset — LYRCH CMS{% endblock %}

{% block admin_content %}
<div class="telemetry-card" style="max-width: 680px; margin: 0 auto; width: 100%;">
    <div class="card-header-bar">
        <div class="header-label">
            <i class="fa-solid fa-cloud-arrow-up" style="color: var(--neon-cyan);"></i>
            <span>UPLOAD CREATIVE ASSET</span>
        </div>
        <a href="{{ url_for('admin_gallery.index') }}" class="header-link">&larr; Back to Asset Library</a>
    </div>

    <form method="POST" action="{{ url_for('admin_gallery.create') }}" enctype="multipart/form-data" style="margin-top: 18px; display: flex; flex-direction: column; gap: 14px;">
        <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                <label style="font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); margin: 0;">ASSET FILE(S) * (PNG, JPG, WEBP, SVG, GIF)</label>
                <span style="font-size: 10px; font-family: var(--font-mono); color: var(--neon-cyan); background: rgba(0,240,255,0.08); padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(0,240,255,0.25);">
                    <i class="fa-solid fa-layer-group"></i> MULTI-SELECT ENABLED
                </span>
            </div>
            <input type="file" name="images" id="createGalleryFileInput" required multiple accept="image/*" onchange="handleCreateGalleryFileChange(this)" style="font-size: 12px; color: var(--text-muted); background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 10px; width: 100%;">
            <div id="createGalleryQueueSummary" style="display: none; margin-top: 6px; font-size: 11.5px; font-family: var(--font-mono); color: var(--neon-cyan); background: rgba(0,240,255,0.08); padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(0,240,255,0.2);"></div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div>
                <label style="font-size: 11px; color: var(--text-muted); display: flex; justify-content: space-between; margin-bottom: 4px; font-family: var(--font-mono);">
                    <span>ASSET TITLE</span>
                    <span style="font-size: 10px; color: var(--text-muted); font-weight: normal;">(Optional for batch)</span>
                </label>
                <input type="text" name="title" placeholder="e.g. Cyberpunk UI (blank = use file names)" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
            </div>

            <div>
                <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px; font-family: var(--font-mono);">CATEGORY</label>
                <select name="category" onchange="const c = document.getElementById('createCustomCatWrap'); if(this.value==='__custom__'){c.style.display='block';document.getElementById('createCustomCatInp').focus();}else{c.style.display='none';}" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
                    {% for c in categories %}
                        <option value="{{ c }}">{{ c }}</option>
                    {% endfor %}
                    <option value="__custom__" style="color: var(--neon-cyan); font-weight: 600;">+ Enter New Category...</option>
                </select>
                <div id="createCustomCatWrap" style="display: none; margin-top: 6px;">
                    <input type="text" name="custom_category" id="createCustomCatInp" placeholder="Enter custom category name..." style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid var(--neon-cyan); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px; box-shadow: 0 0 8px rgba(0,240,255,0.2);">
                </div>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div>
                <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px; font-family: var(--font-mono);">BELONGS TO PROJECT</label>
                <select name="project_id" id="createProjectSelect" onchange="const c = document.getElementById('createNewProjWrap'); if(this.value==='__new__'){c.style.display='block';document.getElementById('createNewProjInp').focus();}else{c.style.display='none';}" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
                    <option value="">None / Standalone Asset</option>
                    <option value="__new__" style="color: var(--neon-cyan); font-weight: 600;">+ Enter Custom / New Project...</option>
                    {% if projects %}
                    <optgroup label="Existing Projects">
                        {% for p in projects %}
                            <option value="{{ p.id }}">{{ p.title }}</option>
                        {% endfor %}
                    </optgroup>
                    {% endif %}
                </select>
                <div id="createNewProjWrap" style="display: none; margin-top: 6px;">
                    <input type="text" name="new_project_title" id="createNewProjInp" placeholder="Enter custom project name..." style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid var(--neon-cyan); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px; box-shadow: 0 0 8px rgba(0,240,255,0.2);">
                </div>
            </div>

            <div>
                <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px; font-family: var(--font-mono);">VISIBILITY STATUS</label>
                <select name="visibility" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
                    <option value="published">🟢 Published (Live on site)</option>
                    <option value="draft">🟡 Draft (Hidden from public)</option>
                    <option value="private">🔒 Private (Admin only)</option>
                </select>
            </div>
        </div>

        <div>
            <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px; font-family: var(--font-mono);">DESCRIPTION</label>
            <textarea name="description" rows="2" placeholder="Visual concept, UX flow, or color notes..." style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;"></textarea>
        </div>

        <div style="display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center;">
            <div>
                <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px; font-family: var(--font-mono);">TAGS (COMMA SEPARATED)</label>
                <input type="text" name="tags" placeholder="figma, darkmode, mobile, ui" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
            </div>
            <div style="padding-top: 14px;">
                <label style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #fff; cursor: pointer;">
                    <input type="checkbox" name="featured" value="1" style="accent-color: var(--neon-cyan);">
                    <span>Featured Asset</span>
                </label>
            </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px;">
            <a href="{{ url_for('admin_gallery.index') }}" class="btn-command-secondary">Cancel</a>
            <button type="submit" class="btn-command-primary">
                <i class="fa-solid fa-cloud-arrow-up"></i> <span id="createGallerySubmitText">Upload &amp; Save Assets</span>
            </button>
        </div>
    </form>
</div>

<script>
function handleCreateGalleryFileChange(input) {
    const files = input.files;
    const summary = document.getElementById('createGalleryQueueSummary');
    const submitText = document.getElementById('createGallerySubmitText');
    if (!files || files.length === 0) {
        if (summary) summary.style.display = 'none';
        if (submitText) submitText.textContent = 'Upload & Save Assets';
        return;
    }
    let totalSizeBytes = 0;
    for (let i = 0; i < files.length; i++) totalSizeBytes += files[i].size;
    const sizeMB = (totalSizeBytes / (1024 * 1024)).toFixed(2);

    if (summary) {
        summary.style.display = 'block';
        if (files.length === 1) {
            summary.innerHTML = `<i class="fa-solid fa-circle-check"></i> 1 file selected (${(files[0].size / 1024).toFixed(1)} KB): <strong>${files[0].name}</strong>`;
            if (submitText) submitText.textContent = 'Upload & Save Asset';
        } else {
            summary.innerHTML = `<i class="fa-solid fa-layer-group"></i> <strong>${files.length} assets queued</strong> (${sizeMB} MB total) &mdash; will be uploaded simultaneously`;
            if (submitText) submitText.textContent = `Upload & Save ${files.length} Assets`;
        }
    }
}
</script>
{% endblock %}
