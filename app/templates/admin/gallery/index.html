{% extends "admin/base.html" %}

{% block title %}Gallery — MY WORK CMS{% endblock %}

{% block admin_content %}
<div class="telemetry-card">
    <div class="card-header-bar">
        <div class="header-label">
            <i class="fa-regular fa-image"></i>
            <span>GALLERY &amp; UI DESIGN ASSETS</span>
        </div>
        <a href="{{ url_for('admin_gallery.create') }}" class="btn-command-primary" style="font-size: 12px; padding: 6px 14px;">
            <i class="fa-solid fa-plus"></i> Upload Image
        </a>
    </div>

    <div style="margin-top: 18px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;">
        {% for item in items %}
            <div style="background: rgba(15,23,42,0.7); border: 1px solid rgba(255,255,255,0.08); border-radius: var(--radius-sm); overflow: hidden;">
                <img src="{{ item.image_url }}" alt="{{ item.title }}" style="width: 100%; height: 130px; object-fit: cover;">
                <div style="padding: 10px;">
                    <h4 style="font-size: 12px; color: #fff;">{{ item.title }}</h4>
                    <span style="font-size: 10px; color: var(--neon-cyan);">{{ item.category }}</span>
                    <form method="POST" action="{{ url_for('admin_gallery.delete', id=item.id) }}" onsubmit="return confirm('Delete image?');" style="margin-top: 8px;">
                        <button type="submit" class="btn-command-secondary" style="width: 100%; padding: 4px; font-size: 11px; color: #f87171;">
                            <i class="fa-regular fa-trash-can"></i> Delete
                        </button>
                    </form>
                </div>
            </div>
        {% else %}
            <div style="grid-column: 1/-1; color: var(--text-muted); text-align: center; padding: 30px;">
                No gallery images uploaded yet.
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
