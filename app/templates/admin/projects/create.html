{% extends "admin/base.html" %}

{% block title %}Create Project — MY WORK CMS{% endblock %}

{% block admin_content %}
<div class="telemetry-card">
    <div class="card-header-bar">
        <div class="header-label">
            <i class="fa-solid fa-folder-plus"></i>
            <span>CREATE NEW PROJECT DOSSIER</span>
        </div>
        <a href="{{ url_for('admin_projects.index') }}" class="header-link">&larr; Back to Projects</a>
    </div>

    <form method="POST" action="{{ url_for('admin_projects.create') }}" enctype="multipart/form-data" style="margin-top: 18px; display: grid; grid-template-columns: 2fr 1fr; gap: 24px;">
        <!-- Left column of form -->
        <div style="display: flex; flex-direction: column; gap: 14px;">
            <div>
                <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">PROJECT NAME</label>
                <input type="text" name="title" required placeholder="PAWSHOP Command Center" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
            </div>

            <div>
                <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">SHORT SUBTITLE / CLASSIFICATION</label>
                <input type="text" name="subtitle" placeholder="IT Helpdesk &amp; Ticketing System" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div>
                    <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">CATEGORY</label>
                    <select name="category" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
                        <option value="IT Operations">IT System / Operations</option>
                        <option value="Software Projects">Software / Web App</option>
                        <option value="Desktop Application">Desktop System (PySide6)</option>
                        <option value="AI Lab">AI Assistant / AI Lab</option>
                    </select>
                </div>

                <div>
                    <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">SYSTEM STATUS</label>
                    <select name="status_badge" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
                        <option value="Live">Live</option>
                        <option value="Beta">Beta</option>
                        <option value="Online">Online</option>
                        <option value="Demo">Demo</option>
                        <option value="In Progress">In Progress</option>
                    </select>
                </div>
            </div>

            <div>
                <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">TECHNOLOGIES (Comma-separated)</label>
                <input type="text" name="technologies" placeholder="Python, Flask, MySQL, HTML, CSS, JavaScript" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
            </div>

            <div>
                <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">SUMMARY (Short card description)</label>
                <textarea name="short_description" rows="2" placeholder="A complete helpdesk system for branches, helpdesk and technical support." style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;"></textarea>
            </div>

            <div>
                <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">DETAILED CASE STUDY OVERVIEW</label>
                <textarea name="full_description" rows="4" placeholder="Detailed breakdown of the architecture, workflow, and implementation..." style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;"></textarea>
            </div>
        </div>

        <!-- Right column of form -->
        <div style="display: flex; flex-direction: column; gap: 16px;">
            <div style="background: rgba(15,23,42,0.6); padding: 16px; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 12px;">
                <h4 style="font-size: 12px; color: #ffffff; letter-spacing: 0.5px;">VISIBILITY &amp; PROMOTION</h4>

                <div>
                    <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">VISIBILITY STATUS</label>
                    <select name="visibility" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 8px 10px; color: #fff; font-size: 12px;">
                        <option value="published">● Published (Live to public)</option>
                        <option value="draft">○ Draft (Only visible in CMS)</option>
                        <option value="private">🔒 Private (Internal archive)</option>
                    </select>
                </div>

                <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #cbd5e1; cursor: pointer;">
                    <input type="checkbox" name="featured" value="1" checked>
                    <span>⭐ Display on Featured Projects row</span>
                </label>
            </div>

            <div style="background: rgba(15,23,42,0.6); padding: 16px; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 12px;">
                <h4 style="font-size: 12px; color: #ffffff; letter-spacing: 0.5px;">PROJECT THUMBNAIL</h4>
                <input type="file" name="thumbnail" accept="image/*" style="font-size: 11px; color: var(--text-muted);">
                <span style="font-size: 10px; color: var(--text-muted);">PNG, JPG, WEBP (Recommended: 600x400)</span>
            </div>

            <div style="background: rgba(15,23,42,0.6); padding: 16px; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 12px;">
                <h4 style="font-size: 12px; color: #ffffff; letter-spacing: 0.5px;">LINKS</h4>

                <div>
                    <label style="font-size: 10.5px; color: var(--text-muted); display: block; margin-bottom: 2px;">GITHUB REPOSITORY URL</label>
                    <input type="url" name="github_url" placeholder="https://github.com/..." style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 7px 10px; color: #fff; font-size: 11.5px;">
                </div>

                <div>
                    <label style="font-size: 10.5px; color: var(--text-muted); display: block; margin-bottom: 2px;">LIVE DEMO URL</label>
                    <input type="url" name="demo_url" placeholder="https://..." style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 7px 10px; color: #fff; font-size: 11.5px;">
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 8px;">
                <button type="submit" class="btn-command-primary" style="flex: 1;">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Save &amp; Deploy
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
