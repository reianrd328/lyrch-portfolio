{% extends "admin/base.html" %}

{% block title %}Upload Document — MY WORK CMS{% endblock %}

{% block admin_content %}
<div class="telemetry-card" style="max-width: 600px; margin: 0 auto; width: 100%;">
    <div class="card-header-bar">
        <div class="header-label">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span>STORE NEW DOCUMENT</span>
        </div>
        <a href="{{ url_for('admin_documents.index') }}" class="header-link">&larr; Back to Documents</a>
    </div>

    <form method="POST" action="{{ url_for('admin_documents.upload') }}" enctype="multipart/form-data" style="margin-top: 18px; display: flex; flex-direction: column; gap: 14px;">
        {% if not is_profile_user %}
        <div>
            <label style="font-size: 11px; color: #c084fc; display: block; margin-bottom: 4px; font-weight: 700;">PORTFOLIO PROFILE</label>
            <select name="profile_id" style="width: 100%; background: #0f172a; border: 1px solid rgba(168,85,247,0.5); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px; cursor: pointer;">
                {% for prof in all_profiles %}
                <option value="{{ prof.id }}" {% if active_profile and prof.id == active_profile.id %}selected{% endif %}>
                    {{ prof.name }} ({{ prof.slug }}){% if prof.is_active %} [ACTIVE ROOT]{% endif %}
                </option>
                {% endfor %}
            </select>
        </div>
        {% else %}
        <input type="hidden" name="profile_id" value="{{ current_user.profile_id }}">
        {% endif %}

        <div>
            <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">DOCUMENT TITLE</label>
            <input type="text" name="title" required placeholder="PAWSHOP System Documentation" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
        </div>

        <div>
            <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">CATEGORY</label>
            <select name="category" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
                <option value="Project Documentation">Project Documentation</option>
                <option value="Resume & CV">Resume &amp; CV</option>
                <option value="IT Manuals">IT Manuals &amp; SOP</option>
                <option value="Whitepaper">Whitepaper / Architecture</option>
            </select>
        </div>

        <div>
            <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">SELECT FILE (PDF, DOCX, ZIP)</label>
            <input type="file" name="document" required accept=".pdf,.doc,.docx,.zip,.txt" style="font-size: 12px; color: var(--text-muted);">
        </div>

        <div>
            <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">DESCRIPTION</label>
            <textarea name="description" rows="2" placeholder="Technical documentation for setup..." style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;"></textarea>
        </div>

        <div style="display: flex; gap: 20px;">
            <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #cbd5e1; cursor: pointer;">
                <input type="checkbox" name="allow_download" value="1" checked> Allow Public Download
            </label>
            <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #cbd5e1; cursor: pointer;">
                <input type="checkbox" name="is_public" value="1" checked> Public Visibility
            </label>
        </div>

        <button type="submit" class="btn-command-primary" style="margin-top: 8px;">
            Upload to Repository
        </button>
    </form>
</div>
{% endblock %}
