{% extends "admin/base.html" %}

{% block title %}Edit Experience — MY WORK CMS{% endblock %}

{% block admin_content %}
<div class="telemetry-card" style="max-width: 650px; margin: 0 auto; width: 100%;">
    <div class="card-header-bar">
        <div class="header-label">
            <i class="fa-solid fa-pen-to-square"></i>
            <span>EDIT CAREER EXPERIENCE // {{ exp.role_title }}</span>
        </div>
        <a href="{{ url_for('admin_experience.index') }}" class="header-link">&larr; Back to Experience</a>
    </div>

    <form method="POST" action="{{ url_for('admin_experience.edit', id=exp.id) }}" style="margin-top: 18px; display: flex; flex-direction: column; gap: 14px;">
        <div>
            <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px; font-weight: 600;">ROLE TITLE</label>
            <input type="text" name="role_title" value="{{ exp.role_title }}" required placeholder="Senior IT Support Specialist" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
        </div>

        <div>
            <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px; font-weight: 600;">ORGANIZATION / COMPANY</label>
            <input type="text" name="company" value="{{ exp.company }}" required placeholder="Multi-Branch Corporate" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
            <div>
                <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px; font-weight: 600;">TIME PERIOD</label>
                <input type="text" name="period" value="{{ exp.period }}" required placeholder="2018 — Present" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
            </div>
            <div>
                <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px; font-weight: 600;">LOCATION</label>
                <input type="text" name="location" value="{{ exp.location or 'Philippines' }}" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
            </div>
        </div>

        <div>
            <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px; font-weight: 600;">DISPLAY ORDER PRIORITY (LOWER APPEARS FIRST)</label>
            <input type="number" name="order_index" value="{{ exp.order_index }}" style="width: 120px; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 8px 12px; color: #fff; font-size: 13px;">
        </div>

        <div>
            <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px; font-weight: 600;">RESPONSIBILITIES &amp; SCOPE</label>
            <textarea name="description" rows="4" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px; line-height: 1.5;">{{ exp.description or '' }}</textarea>
        </div>

        <div>
            <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px; font-weight: 600;">KEY HIGHLIGHTS &amp; BULLET POINTS (ONE PER LINE)</label>
            <textarea name="highlights" rows="3" placeholder="Engineered custom helpdesk triage tool&#10;Reduced mean resolution time by 45%" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px; line-height: 1.5;">{{ exp.highlights or '' }}</textarea>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
            <button type="submit" class="btn-command-primary">
                <i class="fa-solid fa-floppy-disk"></i> Save Experience Changes
            </button>
            <a href="{{ url_for('admin_experience.index') }}" class="btn-command-secondary">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
