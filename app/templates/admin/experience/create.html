{% extends "admin/base.html" %}

{% block title %}Add Experience — MY WORK CMS{% endblock %}

{% block admin_content %}
<div class="telemetry-card" style="max-width: 600px; margin: 0 auto; width: 100%;">
    <div class="card-header-bar">
        <div class="header-label">
            <i class="fa-solid fa-briefcase"></i>
            <span>LOG CAREER EXPERIENCE</span>
        </div>
        <a href="{{ url_for('admin_experience.index') }}" class="header-link">&larr; Back to Experience</a>
    </div>

    <form method="POST" action="{{ url_for('admin_experience.create') }}" style="margin-top: 18px; display: flex; flex-direction: column; gap: 14px;">
        <div>
            <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">ROLE TITLE</label>
            <input type="text" name="role_title" required placeholder="Senior IT Support Specialist" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
        </div>

        <div>
            <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">ORGANIZATION / COMPANY</label>
            <input type="text" name="company" required placeholder="Multi-Branch Corporate" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
            <div>
                <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">TIME PERIOD</label>
                <input type="text" name="period" required placeholder="2018 — Present" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
            </div>
            <div>
                <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">LOCATION</label>
                <input type="text" name="location" value="Philippines" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;">
            </div>
        </div>

        <div>
            <label style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px;">RESPONSIBILITIES &amp; SCOPE</label>
            <textarea name="description" rows="3" style="width: 100%; background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 9px 12px; color: #fff; font-size: 13px;"></textarea>
        </div>

        <button type="submit" class="btn-command-primary" style="margin-top: 8px;">
            Log Experience
        </button>
    </form>
</div>
{% endblock %}
